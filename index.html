<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Funkloch</title>
    <!-- All relative, so the page keeps working under a deploy sub-path. -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#10131a" />
    <style>
      :root {
        --bg: #10131a;
        --panel: #171b25;
        --line: #262d3b;
        --text: #e7ebf3;
        --muted: #8a94a8;
        --signal: #5ad1c0;
        --signal-dim: #2f6d66;
        --sender: #f4c257;
        --over: #f08a62;
        --preview: #9b8cf0;
        --marked: #6d7789;
        --forbidden: #59617a;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-text-size-adjust: 100%;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 100%;
      }

      /* Three rows, in order of how much they matter while a run is on.
         Their own gap, tighter than the one between the page's blocks, so the
         header reads as one thing and not as three. */
      .head {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-variant-numeric: tabular-nums;
      }

      /* Row 1: bookkeeping. Small and dimmed on purpose — it is what you check
         between runs, never what you play against. */
      .ledger {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      .ledger b { color: var(--text); font-weight: 600; }
      /* Pushes the score to the far edge, so the two readings bracket the row. */
      .ledger-score { margin-left: auto; }
      /* The record is quieter than the live number: it is there to be aimed at.
         The separator is drawn here rather than written into the element, so an
         empty record stays genuinely empty for anything reading the text. */
      .ledger .best { font-style: normal; opacity: 0.75; }
      .ledger .best:not(:empty)::before { content: '·'; margin: 0 5px; opacity: 0.6; }

      /* The switch between the two ways to play. It belongs in the bookkeeping
         row because that is what it is — something you set between runs, never
         something you play against — and it is deliberately sized under that
         row's line box so the header keeps exactly the height it had. The
         padding and line-height here are the whole reason: the page-wide
         `button` rule below sets a 44px minimum, which would grow the row. */
      .modes { display: flex; gap: 3px; align-self: center; }
      .modes button {
        flex: 0 0 auto;
        min-height: 0;
        padding: 1px 8px;
        font: inherit;
        line-height: 1.1;
        border-radius: 999px;
        background: none;
        color: var(--muted);
      }
      .modes button[aria-pressed='true'] { color: var(--text); border-color: var(--muted); }

      /* Row 2: the race. Two numbers that pull against each other, so they sit
         at opposite ends with the rule measuring out the distance between. */
      .race { display: flex; align-items: center; gap: 12px; }
      .race-value { display: flex; align-items: baseline; gap: 6px; }
      /* Number before label in both, so the eye finds the digits in one place
         instead of learning two orders. */
      .race-value b { font-size: 30px; font-weight: 700; line-height: 1; color: var(--text); }
      .race-value span { font-size: 13px; color: var(--muted); }
      .race-rule { flex: 1 1 auto; min-width: 16px; height: 1px; background: var(--line); }

      /* The mark, small, ahead of the stage count. It must not set the height
         of the row: 13px text gives the line box about 20px, and centring a
         16px box inside it cannot add to that. Baseline alignment would, which
         is why this one item opts out of it. */
      .hud-mark {
        width: 16px;
        height: 16px;
        flex: none;
        align-self: center;
        /* The flex gap is meant for the space between readings; the mark
           belongs to the stage count, so it sits closer than that. */
        margin-right: -6px;
      }
      /* Prefixed on purpose: `.node` and `.edge` belong to the board, and a
         mark wearing them would answer every selector that asks for one. */
      .hud-mark .mark-edge { fill: none; stroke: var(--signal-dim); stroke-width: 2; stroke-linecap: round; }
      .hud-mark .mark-hole { fill: var(--bg); stroke: var(--muted); stroke-width: 2; }
      .hud-mark .mark-node { fill: var(--signal); }

      /* Positioned, so the board can fill it outright: a percentage height on
         a flex item does not resolve against a flex-derived height. */
      #stage { flex: 1; min-height: 320px; position: relative; }

      /* Fills the stage and scales the drawing to fit; preserveAspectRatio
         keeps the geometry undistorted. */
      .board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
      /* Chrome focuses the SVG root when the empty board is clicked and draws a
         frame around the whole thing. The nodes carry their own focus ring, so
         the root is not a meaningful focus target and needs none. */
      .board:focus { outline: none; }

      /* ---- edges ---------------------------------------------------------- */
      .edge {
        stroke: var(--line);
        stroke-width: 2.5;
        stroke-linecap: round;
        transition: stroke 140ms ease-out, stroke-width 140ms ease-out;
        transition-delay: var(--delay, 0ms);
      }
      .edge.is-lit { stroke: var(--signal-dim); stroke-width: 3.5; }
      /* Preview rides on top of whatever the edge already shows. */
      .edge.in-range {
        stroke: var(--preview);
        stroke-width: 4;
        transition-delay: var(--preview-delay, 0ms);
      }

      /* ---- nodes ---------------------------------------------------------- */
      /* Three independent cues, so none of this depends on colour vision:
         supplied nodes are bigger AND solid, transmitters wear a ring, and one
         transmitter too many makes that ring dashed. */
      .dot {
        fill: var(--bg);
        stroke: var(--muted);
        stroke-width: 2.5;
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 140ms cubic-bezier(0.2, 0.8, 0.3, 1), fill 140ms ease-out,
          stroke 140ms ease-out;
        transition-delay: var(--delay, 0ms);
      }
      .is-covered .dot { fill: var(--signal); stroke: var(--signal); transform: scale(1.75); }
      .is-transmitter .dot { fill: var(--sender); stroke: var(--sender); transform: scale(2); }
      .is-over-budget .dot { fill: var(--over); stroke: var(--over); }

      .ring {
        fill: none;
        stroke: var(--sender);
        stroke-width: 3;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        transform: scale(0.55);
        transition: opacity 140ms ease-out, transform 140ms cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      .is-transmitter .ring { opacity: 1; transform: scale(1); }
      .is-over-budget .ring { stroke: var(--over); stroke-dasharray: 5 5; }

      /* ---- range preview -------------------------------------------------- */
      .aura {
        fill: none;
        stroke: var(--preview);
        stroke-width: 2.5;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        transform: scale(0.6);
        transition: opacity 140ms ease-out, transform 140ms cubic-bezier(0.2, 0.8, 0.3, 1);
        transition-delay: var(--preview-delay, 0ms);
      }
      .in-range .aura { opacity: 1; transform: scale(1); }

      /* ---- the player's own notes ------------------------------------------ */
      /* Dimmed *and* struck through: neither cue needs colour to read. */
      .cross line {
        stroke: var(--marked);
        stroke-width: 3;
        stroke-linecap: round;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        transform: scale(0.4);
        transition: opacity 120ms ease-out, transform 120ms cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      .is-marked .cross line { opacity: 1; transform: scale(1); }
      .is-marked .dot { fill: var(--bg); stroke: var(--marked); opacity: 0.55; }
      /* A note stays readable while the range is on show. */
      .in-range.is-marked .cross line { stroke: var(--text); opacity: 1; }
      /* Held long enough that letting go will note the node: say so first. */
      .is-arming .cross line { opacity: 0.45; transform: scale(1); }

      /* ---- conflict: two signals on one node --------------------------------- */
      /* Two concentric rings, so the cue is a shape and a count, not a colour. */
      .clash circle {
        fill: none;
        stroke: var(--over);
        stroke-width: 2.5;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        transform: scale(0.7);
        transition: opacity 140ms ease-out, transform 140ms cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      .is-conflict .clash circle { opacity: 1; transform: scale(1); }
      .is-conflict .dot { fill: var(--over); stroke: var(--over); }

      /* ---- impermeable nodes ------------------------------------------------ */
      /* It lights up, it can hold a transmitter, but no signal passes through
         it. Said with a different *body*, not with a frame: an octagon filled
         with hatching where an ordinary node is a plain circle. A ring around
         an otherwise normal node read as decoration, and decoration says
         "singled out", not "wall". Shape and fill, so neither cue is colour. */
      .shell { pointer-events: none; }
      /* On these nodes the octagon is the node; the circle would only sit
         inside it and blur what kind of thing this is. */
      .is-blocked .dot { display: none; }
      .shell-plate {
        fill: var(--bg);
        stroke: var(--muted);
        stroke-width: 2.5;
        stroke-linejoin: round;
        transition: fill 140ms ease-out, stroke 140ms ease-out;
        transition-delay: var(--delay, 0ms);
      }
      .shell-hatch line {
        stroke: var(--muted);
        stroke-width: 1.6;
        transition: stroke 140ms ease-out;
        transition-delay: var(--delay, 0ms);
      }
      /* Supplied: the hatching lights up, the body stays hollow. Bright strokes
         on a dark plate — plainly lit, and still plainly hatched. */
      .is-blocked.is-covered .shell-plate { stroke: var(--signal); }
      .is-blocked.is-covered .shell-hatch line { stroke: var(--signal); }
      /* Carrying a transmitter: the body fills and the hatching inverts into
         grooves cut out of it, which is the same flip from hollow to solid that
         an ordinary node makes when a transmitter lands on it. */
      .is-blocked.is-transmitter .shell-plate { fill: var(--sender); stroke: var(--sender); }
      .is-blocked.is-transmitter .shell-hatch line { stroke: var(--bg); }

      /* ---- forbidden nodes -------------------------------------------------- */
      /* Square, not round, and barred: two non-colour cues at once. */
      .block { opacity: 0; pointer-events: none; }
      .is-forbidden .block { opacity: 1; }
      .is-forbidden .dot,
      .is-forbidden .ring,
      .is-forbidden .cross { display: none; }
      .plate { fill: var(--forbidden); stroke: var(--text); stroke-width: 1.5; }
      .bar { fill: var(--bg); }
      /* A signal is reaching it: say so loudly, but block nothing. */
      .is-violated .plate {
        fill: var(--over);
        stroke: var(--over);
        stroke-width: 3;
        stroke-dasharray: 4 3;
      }
      .is-forbidden.in-range .aura { stroke: var(--over); }

      /* ---- the radius written on a transmitter ------------------------------ */
      .radius {
        fill: var(--bg);
        font: 700 11px system-ui, sans-serif;
        pointer-events: none;
        user-select: none;
      }

      .hit { fill: transparent; cursor: pointer; outline: none; }
      .hit:focus-visible { stroke: var(--text); stroke-width: 2; stroke-dasharray: 4 4; }
      .node.is-pressed .dot { transform: scale(1.35); transition-duration: 80ms; }
      .node.is-pressed.is-covered .dot { transform: scale(1.5); }

      /* ---- win: one calm breath, nothing more -----------------------------
         Brightness, not opacity: fading the dots would let the edges show
         through them and the board would look dirty for a second. */
      @keyframes breathe {
        50% { filter: brightness(1.2); }
      }
      .board.is-won .nodes,
      .board.is-won .edges { animation: breathe 1.6s ease-in-out 1; }

      @media (prefers-reduced-motion: reduce) {
        .dot, .edge, .ring { transition-duration: 1ms; transition-delay: 0ms; }
        .board.is-won .nodes, .board.is-won .edges { animation: none; }
      }

      /* ---- the end of a run ------------------------------------------------
         A card over the board rather than a dialog: nothing to dismiss, nothing
         that steals focus, and the board it refers to stays visible behind it. */
      .over {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 4px;
        text-align: center;
        /* Plain first, so a browser without color-mix still dims the board. */
        background: rgba(16, 19, 26, 0.86);
        background: color-mix(in srgb, var(--bg) 86%, transparent);
        animation: settle 420ms ease-out 1;
      }
      /* An author `display` beats the UA rule behind the hidden attribute, so
         the card would otherwise sit on the board from the first frame on. */
      .over[hidden] { display: none; }
      @keyframes settle { from { opacity: 0; } }
      /* The wordmark is drawn rather than set: the o is the same ring the
         board draws for a node with no signal, in the same two colours. Inline
         SVG and not a file, so it follows the palette instead of having to be
         redrawn for every change of it. `overflow: visible` matters — the two
         halves are anchored around the ring, so the total width follows
         whatever the system font is and may reach past the viewBox. */
      .wordmark {
        display: block;
        width: 184px;
        max-width: 72vw;
        height: auto;
        margin: 0 auto 14px;
        overflow: visible;
      }
      .wordmark text {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: 0.5px;
        fill: var(--text);
      }
      .wordmark .mark-hole { fill: none; stroke: var(--muted); stroke-width: 5; }

      .over h2 { margin: 0 0 6px; font-size: 17px; font-weight: 600; color: var(--muted); }
      .over dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto auto;
        gap: 2px 14px;
        font-variant-numeric: tabular-nums;
      }
      .over dt { color: var(--muted); text-align: right; }
      .over dd { margin: 0; text-align: left; font-weight: 600; }
      .over .record { margin: 10px 0 0; color: var(--signal); font-size: 14px; }
      /* The one place a new game can be started from. Sized here rather than
         stretched by the .controls flex row it no longer lives in. */
      .over .again { margin: 16px auto 0; flex: 0 0 auto; min-width: 160px; }

      /* The daily card ends differently: there is no next game to offer, only
         a result to take away and the wait for the next board. */
      .over .daily { margin: 14px 0 0; }
      .over .share { margin: 0 auto; flex: 0 0 auto; min-width: 180px; }
      /* Only shown when the copy did not go through, so the line can still be
         selected by hand. `user-select: all` makes that one gesture. */
      /* Same trap as `.over[hidden]` above: an author `display` beats the UA
         rule behind the hidden attribute, so this needs saying twice. */
      .over .share-line[hidden] { display: none; }
      .over .share-line {
        display: block;
        /* Hugs the line rather than spanning the card, so the pill reads as the
           one thing to grab. */
        width: fit-content;
        max-width: 100%;
        margin: 8px auto 0;
        padding: 6px 10px;
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        font-size: 13px;
        user-select: all;
      }
      .over .countdown { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
      .over .countdown b { color: var(--text); font-variant-numeric: tabular-nums; }

      @media (prefers-reduced-motion: reduce) {
        .over { animation: none; }
      }

      /* ---- chrome --------------------------------------------------------- */
      /* No reserved line. It speaks on a cleared stage and at no other time,
         which is the same moment the button row below appears, so the height
         it used to hold open all run long is the board's instead. */
      #status { margin: 0; color: var(--muted); }
      #status.is-won { color: var(--signal); }
      #status.is-over { color: var(--over); }

      /* Row 3: the hand. The first card is bigger and lit, the next two are
         small and pale — that says "now, then, then" without the words that
         used to be there saying it. */
      .hand { display: flex; align-items: center; gap: 10px; }
      .chip {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: 2px solid var(--line);
        background: var(--panel);
      }
      .chip.now { width: 56px; height: 56px; border-color: var(--sender); color: var(--sender); }
      .chip.next { opacity: 0.6; color: var(--muted); }
      .chip.empty { opacity: 0.25; }
      /* Reach drawn, not written: a filled centre and one ring per hop, which
         is the same picture the board makes when the signal spreads. Prefixed,
         because `.dot` and `.ring` belong to the board and a chip wearing them
         would answer every selector that asks for a node. */
      .chip svg { display: block; width: 82%; height: 82%; overflow: visible; }
      .chip-core { fill: currentColor; }
      .chip-ring { fill: none; stroke: currentColor; stroke-width: 1.6; }
      /* The rings alone did not carry the small card. Measured on the 44px
         chip at both pixel ratios: three rings land at radius 6.15 / 10.45 /
         14.76 px with a 1.64px stroke, so 2.66px of clear space between them,
         and a scan along the centre line comes back to the panel colour
         between every pair (peaks 84-95, valleys 23 on a 33 background) at
         DPR 1 as well as DPR 2. They do not smear.
         What they do not do is count: two rings and three differ by one thin
         stroke in a crowded target, and the card has to be read at a glance,
         not studied. Hence the digit, which is the cheap half of the fix —
         growing the rings would have cost the 44px card its size. It sits in
         the corner on a disc of the card's own colour, because the glyph box
         reaches back to 10.6 from the centre and would otherwise lie across
         the outermost ring at 15.2. */
      .chip-plate { fill: var(--panel); }
      .chip-digit {
        fill: currentColor;
        font: 700 9px system-ui, -apple-system, "Segoe UI", sans-serif;
        opacity: 0.9;
      }

      .sets { display: flex; gap: 8px; }
      .sets button {
        flex: 0 1 auto;
        min-height: 36px;
        padding: 0 14px;
        border-radius: 999px;
        font-size: 14px;
        color: var(--muted);
      }
      .sets button[aria-pressed='true'] {
        color: var(--text);
        border-color: var(--signal-dim);
        background: #1c2430;
      }

      /* Empty for most of a run — `Weiter` only shows up on a cleared stage,
         and `Neue Partie` has moved onto the end card. Hidden outright then,
         so the row does not spend the board's height on nothing. */
      .controls { display: flex; gap: 10px; }
      .controls[hidden] { display: none; }
      button {
        flex: 1;
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:disabled { opacity: 0.4; cursor: default; }
      button:not(:disabled):hover { border-color: var(--muted); }

      .hint { margin: 0; color: var(--muted); font-size: 14px; }
      kbd {
        padding: 1px 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--panel);
        font: inherit;
        font-size: 13px;
      }
      .error { color: var(--over); }
      .error code { background: var(--panel); padding: 2px 6px; border-radius: 5px; }
    </style>
  </head>
  <body>
    <!-- Classic script, deliberately before the module: a module that fails to
         link never runs its own error handling, and the page would otherwise
         sit there blank with the reason only in the developer console. -->
    <script>
      window.__fatal = function (detail) {
        var stage = document.getElementById('stage');
        if (!stage || stage.dataset.fatal) return;
        stage.dataset.fatal = '1';
        stage.innerHTML =
          '<p class="error">Die Seite konnte nicht starten.<br /><code>' +
          String(detail).replace(/[<&]/g, function (c) { return c === '<' ? '&lt;' : '&amp;'; }) +
          '</code><br />Meist ein veraltetes Modul im Browser-Cache: einmal hart neu laden ' +
          '(<kbd>Strg</kbd>/<kbd>Cmd</kbd> + <kbd>Shift</kbd> + <kbd>R</kbd>).</p>';
      };
      window.addEventListener('error', function (event) {
        window.__fatal(event.message || event.error || 'Unbekannter Fehler');
      });
      window.addEventListener('unhandledrejection', function (event) {
        window.__fatal(event.reason && event.reason.message ? event.reason.message : event.reason);
      });
    </script>

    <main>
      <div class="head">
        <div class="ledger" id="hud-ledger">
          <svg class="hud-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="mark-edge" d="M4.5 4.5 12 12M19.5 4.5 12 12M4.5 19.5 12 12M19.5 19.5 12 12" />
            <circle class="mark-hole" cx="12" cy="12" r="3.6" />
            <g class="mark-node">
              <circle cx="4.5" cy="4.5" r="2.6" /><circle cx="19.5" cy="4.5" r="2.6" />
              <circle cx="4.5" cy="19.5" r="2.6" /><circle cx="19.5" cy="19.5" r="2.6" />
            </g>
          </svg>
          <span>Etappe <b id="hud-stage">–</b></span>
          <div class="modes" id="modes" role="group" aria-label="Spielart">
            <button type="button" id="mode-frei" aria-pressed="true">Frei</button>
            <button type="button" id="mode-taeglich" aria-pressed="false">Täglich</button>
          </div>
          <span class="ledger-score">Punkte <b id="hud-score">0</b><i class="best" id="hud-score-best"></i></span>
        </div>

        <div class="race" id="hud-race">
          <span class="race-value">
            <b id="hud-open">–</b> <span id="hud-open-label">Funklöcher</span>
          </span>
          <span class="race-rule" aria-hidden="true"></span>
          <span class="race-value">
            <b id="hud-left">–</b> <span>Depot</span>
          </span>
        </div>

        <div class="hand" id="hud-hand">
          <span class="chip now" id="chip-now"></span>
          <span class="chip next" id="chip-1"></span>
          <span class="chip next" id="chip-2"></span>
        </div>
      </div>

      <div id="stage">
        <div class="over" id="over" role="status" hidden>
          <svg class="wordmark" id="wordmark" viewBox="0 0 184 48" role="img" aria-label="funkloch">
            <title>funkloch</title>
            <text x="94" y="40" text-anchor="end">funkl</text>
            <circle class="mark-hole" cx="114" cy="27" r="14" />
            <text x="134" y="40">ch</text>
          </svg>
          <h2>Depot leer.</h2>
          <dl>
            <dt>Etappe</dt><dd id="over-stage">–</dd>
            <dt>Punkte</dt><dd id="over-score">–</dd>
            <dt id="over-best-label">Bestwert</dt><dd id="over-best">–</dd>
          </dl>
          <p class="record" id="over-record" hidden>Neuer Bestwert.</p>
          <div class="daily" id="over-daily" hidden>
            <button class="share" id="share" type="button">Ergebnis kopieren</button>
            <code class="share-line" id="share-line" hidden></code>
            <p class="countdown">Nächstes Brett in <b id="countdown">–</b></p>
          </div>
          <button class="again" id="restart" type="button">Neue Partie</button>
        </div>
      </div>

      <p id="status" role="status"></p>

      <div class="controls" id="controls" hidden>
        <button id="go" type="button" hidden>Weiter</button>
      </div>

      <p class="hint">
        Tippen setzt den Sender aus der Hand — gesetzt ist gesetzt. Achteckige
        Knoten leuchten selbst, geben das Signal aber nicht weiter.
      </p>
    </main>

    <script type="module">
      import {
        advance, createRun, dailySeed, ENDLESS_RUN, msUntilNextDay, place, utcDay,
      } from './src/run.js';
      import { createScene, fitHitAreas, render } from './src/render.js';
      import { attachInput } from './src/input.js';

      const SVG_NS = 'http://www.w3.org/2000/svg';

      const stage = document.getElementById('stage');
      const statusLine = document.getElementById('status');
      const goButton = document.getElementById('go');
      const controls = document.getElementById('controls');
      const hud = {
        stage: document.getElementById('hud-stage'),
        open: document.getElementById('hud-open'),
        openLabel: document.getElementById('hud-open-label'),
        left: document.getElementById('hud-left'),
        score: document.getElementById('hud-score'),
        scoreBest: document.getElementById('hud-score-best'),
        now: document.getElementById('chip-now'),
        next: [document.getElementById('chip-1'), document.getElementById('chip-2')],
      };
      const over = {
        card: document.getElementById('over'),
        stage: document.getElementById('over-stage'),
        score: document.getElementById('over-score'),
        bestLabel: document.getElementById('over-best-label'),
        best: document.getElementById('over-best'),
        record: document.getElementById('over-record'),
        daily: document.getElementById('over-daily'),
        share: document.getElementById('share'),
        shareLine: document.getElementById('share-line'),
        countdown: document.getElementById('countdown'),
        restart: document.getElementById('restart'),
      };
      const modeButtons = {
        frei: document.getElementById('mode-frei'),
        taeglich: document.getElementById('mode-taeglich'),
      };

      /**
       * Records live in localStorage and nowhere else. Every access is guarded:
       * a browser with storage switched off, or a page opened straight off the
       * file system, must still play — it simply forgets.
       */
      const BEST_KEY = 'funkloch.endlos.best';
      /** Today's daily attempt: which day it is for, and every move in it. */
      const DAILY_KEY = 'funkloch.taeglich';
      /** Which of the two modes the page was last left in. */
      const MODE_KEY = 'funkloch.modus';

      /**
       * The game used to be called Sendernetz and kept its records under that
       * prefix. They are not carried over — a record belongs to the mode it was
       * set in, and the mode has moved on — so the old keys are simply dropped.
       * No marker is needed to do this only once: after the first load there is
       * nothing left to find.
       */
      try {
        for (const key of Object.keys(localStorage)) {
          if (key.startsWith('sendernetz.')) localStorage.removeItem(key);
        }
      } catch {
        /* storage denied: then there is nothing of the old name to clear either */
      }

      /**
       * Points are the only record kept. The stage a run reached is still shown
       * while it runs, but it is no longer something to beat: two records left
       * it unclear which one a run was *for*, and of the two, points are the
       * better measure. They rise with the stage anyway, and between two runs
       * that died on the same board they still tell apart the one that cleared
       * its stages with transmitters to spare from the one that scraped
       * through. Endurance is in there; efficiency is only in the points.
       *
       * Older builds stored `{stage, score}` here. The score carries over by
       * itself; the stage record is dropped rather than migrated, because there
       * is nothing left for it to be.
       */
      const readBest = () => {
        try {
          const stored = JSON.parse(localStorage.getItem(BEST_KEY) ?? 'null');
          return Number.isFinite(stored?.score) ? stored.score : 0;
        } catch {
          return 0;
        }
      };
      const writeBest = (score) => {
        try {
          localStorage.setItem(BEST_KEY, JSON.stringify({ score }));
        } catch {
          /* storage full or denied: the run still counts, it just is not kept */
        }
      };

      /**
       * Today's daily attempt as it stands: the day it belongs to and every
       * move made in it, a node id for a placement and `null` for the step onto
       * the next stage.
       *
       * The moves and not merely the result, because that settles both halves
       * of "one attempt a day" at once. A reload replays the attempt to exactly
       * where it was left, so an accidental refresh costs nothing — and there
       * is no point at which the page could hand back an unplayed board, so a
       * deliberate refresh buys nothing either. Storing only the final result
       * would have had to choose between those two.
       */
      const readDaily = () => {
        try {
          const stored = JSON.parse(localStorage.getItem(DAILY_KEY) ?? 'null');
          if (typeof stored?.day !== 'string' || !Array.isArray(stored?.moves)) return null;
          return stored;
        } catch {
          return null;
        }
      };
      const writeDaily = (value) => {
        try {
          localStorage.setItem(DAILY_KEY, JSON.stringify(value));
        } catch {
          /* storage denied: then the attempt simply is not held across a reload */
        }
      };

      const readMode = () => {
        try {
          return localStorage.getItem(MODE_KEY) === 'taeglich' ? 'taeglich' : 'frei';
        } catch {
          return 'frei';
        }
      };
      const writeMode = (value) => {
        try {
          localStorage.setItem(MODE_KEY, value);
        } catch {
          /* storage denied: then the page opens in the free mode every time */
        }
      };

      let best = readBest();
      /** Whether *this* run has already pushed the record. */
      let record = false;

      /** 'frei' or 'taeglich'. */
      let mode = 'frei';
      /** The UTC day the daily attempt on screen belongs to. */
      let today = null;
      /** That attempt's moves, in order. */
      let moves = [];
      /** The free run set aside while the daily board is up, so that flipping
       *  the switch and flipping it back does not throw a run away. */
      let parked = null;
      /** Handle of the countdown on the daily end card. */
      let ticker = null;

      let state = null;
      let scene = null;
      let detach = null;
      let boardKey = null;

      /**
       * Draws one card of the hand: a filled centre and one ring per hop of
       * reach, so a radius 3 wears three rings. Rings and not a digit because
       * that is the shape the board itself makes when the signal spreads — the
       * card and the board then say the same thing in the same language.
       *
       * Fixed in a 32-unit box and scaled by the chip, so the small cards and
       * the big one are one drawing at two sizes. The outermost ring of a
       * radius 3 lands at 15.2 of the 16 available; the mix in ENDLESS_RUN
       * tops out there, and a wider reach would need the step reworked rather
       * than simply extended.
       * @param {HTMLElement} chip
       * @param {number|null} radius null for a card that is not dealt
       */
      function drawChip(chip, radius) {
        chip.classList.toggle('empty', radius === null);
        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('viewBox', '0 0 32 32');
        svg.setAttribute('role', 'img');
        svg.setAttribute('aria-label', radius === null ? 'keine Karte' : `Reichweite ${radius}`);

        const core = document.createElementNS(SVG_NS, 'circle');
        core.setAttribute('class', 'chip-core');
        core.setAttribute('cx', '16');
        core.setAttribute('cy', '16');
        core.setAttribute('r', '3');
        svg.append(core);

        for (let hop = 0; hop < (radius ?? 0); hop++) {
          const ring = document.createElementNS(SVG_NS, 'circle');
          ring.setAttribute('class', 'chip-ring');
          ring.setAttribute('cx', '16');
          ring.setAttribute('cy', '16');
          ring.setAttribute('r', String(6 + hop * 4.2));
          svg.append(ring);
        }

        // The digit the rings turned out to need on the small card; see the
        // measurement next to .chip-digit in the stylesheet.
        if (radius !== null) {
          const plate = document.createElementNS(SVG_NS, 'circle');
          plate.setAttribute('class', 'chip-plate');
          plate.setAttribute('cx', '26.5');
          plate.setAttribute('cy', '26.5');
          plate.setAttribute('r', '5');
          const digit = document.createElementNS(SVG_NS, 'text');
          digit.setAttribute('class', 'chip-digit');
          digit.setAttribute('x', '26.5');
          digit.setAttribute('y', '29.8');
          digit.setAttribute('text-anchor', 'middle');
          digit.textContent = String(radius);
          svg.append(plate, digit);
        }
        chip.replaceChildren(svg);
      }

      /** Rebuilds the SVG only when the board actually changed. */
      function mount() {
        const key = `${state.seed}:${state.stage}`;
        if (key === boardKey) return;
        boardKey = key;
        detach?.();
        // A tighter margin than the default: this board is the whole screen,
        // not one item on a page, and 36 units of air around it cost about a
        // sixth of the drawing. RING_RADIUS is the floor and render.js clamps
        // to it, so a transmitter on an outer node still fits its ring.
        scene = createScene({ graph: state.graph, k: 1 }, { padding: 26 });
        // The end-of-run card lives inside the stage so it can lie over the
        // board; it has to be put back, or the first new board takes it with it.
        stage.replaceChildren(scene.svg, over.card);
        detach = attachInput(scene, {
          onToggle: (id) => {
            // A tap that changes nothing — an occupied node, a finished run —
            // is not a move and must not be written into the daily attempt,
            // which is replayed move for move.
            const next = place(state, id);
            if (next === state) return;
            logDaily(id);
            apply(next);
          },
          // No onToggleMark on purpose: a placement is final here, so the board
          // has exactly one action and input.js leaves the hold ladder off. A
          // tap places, however long the finger rests.
          //
          // onPreview is empty for its own reason. Estimating how far a
          // transmitter reaches is the game; reading it off a highlight is not.
          // showRange stays in render.js for the other modes.
          onPreview: () => {},
          onPreviewEnd: () => {},
        });
        fitHitAreas(scene);
      }

      /**
       * The record is kept as the run happens, not at its end: the moment the
       * player passes their old best the HUD says so, which is the only moment
       * it means anything.
       *
       * Free play only. A daily board is one attempt against one board, which
       * is not the same contest and does not belong in the same number.
       */
      function trackRecord() {
        if (mode !== 'frei' || state.score <= best) return;
        best = state.score;
        record = true;
        writeBest(best);
      }

      function draw() {
        mount();
        render(scene, state);
        trackRecord();
        syncModes();

        hud.stage.textContent = String(state.stage);
        hud.open.textContent = String(state.uncovered.length);
        hud.openLabel.textContent = state.uncovered.length === 1 ? 'Funkloch' : 'Funklöcher';
        hud.left.textContent = String(state.depot.length);
        hud.score.textContent = String(state.score);
        // Lower case, and the separator comes from CSS: an empty record has to
        // stay empty, or the dot in front of it shows up on its own. Silent on
        // a daily board — there is no record there to aim at, and showing the
        // free mode's next to a daily score would invite exactly the comparison
        // that is not meant.
        hud.scoreBest.textContent = mode === 'frei' && best > 0 ? `best ${best}` : '';

        drawChip(hud.now, state.current ?? null);
        hud.next.forEach((chip, index) => drawChip(chip, state.preview[index] ?? null));

        statusLine.classList.toggle('is-won', state.status === 'stageCleared');
        goButton.hidden = state.status !== 'stageCleared';
        // Nothing to show means no row: the height belongs to the board.
        controls.hidden = goButton.hidden;
        // On a lost run the card below says everything; a second sentence under
        // the board would only repeat it louder.
        statusLine.textContent =
          state.status === 'stageCleared'
            ? `Etappe ${state.stage} geschafft. ${state.depot.length} Sender übrig.`
            : '';

        over.card.hidden = state.status !== 'lost';
        if (state.status === 'lost') {
          const daily = mode === 'taeglich';
          over.stage.textContent = String(state.stage);
          over.score.textContent = String(state.score);
          over.best.textContent = `${best} Punkte`;
          // A daily board ends on a result and a wait, not on an offer of
          // another game: there is no other game until midnight.
          over.bestLabel.hidden = daily;
          over.best.hidden = daily;
          over.record.hidden = daily || !record;
          over.daily.hidden = !daily;
          over.restart.hidden = daily;
          if (daily) openDailyEnd(); else stopTicker();
        } else {
          stopTicker();
        }
      }

      function apply(next) {
        state = next;
        saveDaily();
        draw();
      }

      // ---- the daily board ---------------------------------------------------

      /** Notes a move of the daily attempt. Called before it is applied, so
       *  what ends up stored always replays from the start. */
      function logDaily(move) {
        if (mode === 'taeglich') moves = [...moves, move];
      }

      function saveDaily() {
        if (mode !== 'taeglich') return;
        writeDaily({
          day: today,
          moves,
          stage: state.stage,
          score: state.score,
          done: state.status === 'lost',
        });
      }

      /**
       * Opens the daily board: today's if there is no attempt on it yet, and
       * otherwise the attempt already made, replayed to where it was left.
       *
       * The date is asked of `utcDay`, which reads the clock in UTC and not in
       * the local zone. That is the difference between everyone playing the
       * same board and New Zealand playing tomorrow's while California is still
       * on yesterday's, which would make two results incomparable.
       */
      function startDaily() {
        if (mode === 'frei' && state !== null) parked = state;
        mode = 'taeglich';
        writeMode(mode);
        boardKey = null;
        record = false;
        today = utcDay(Date.now());
        const stored = readDaily();
        moves = stored?.day === today ? stored.moves : [];
        let next = createRun({ seed: dailySeed(Date.now()), config: ENDLESS_RUN });
        for (const move of moves) next = move === null ? advance(next) : place(next, move);
        apply(next);
      }

      /** The line the share button hands over. The result and nothing else: no
       *  board, no moves, nothing that would spoil the day for whoever reads
       *  it, and no link to make it travel further than it was meant to. */
      function shareLine() {
        const [, month, day] = today.split('-');
        return `funkloch ${day}.${month}. — Etappe ${state.stage}, ${state.score} Punkte`;
      }

      /**
       * Copies text, by the modern route where there is one.
       *
       * `navigator.clipboard` is missing on an insecure origin and can be
       * refused outright, so the old selection trick stays as a fallback, and a
       * boolean comes back either way — the card shows the line for copying by
       * hand when neither route worked.
       * @param {string} text
       * @returns {Promise<boolean>}
       */
      async function copyText(text) {
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch {
          /* denied or unavailable: fall through to the old way */
        }
        try {
          const area = document.createElement('textarea');
          area.value = text;
          area.setAttribute('readonly', '');
          // Off-screen, but laid out: `display: none` or `visibility: hidden`
          // would leave the selection empty and the copy a no-op.
          area.style.position = 'fixed';
          area.style.top = '-1000px';
          document.body.append(area);
          area.select();
          const copied = document.execCommand('copy');
          area.remove();
          return copied;
        } catch {
          return false;
        }
      }

      function stopTicker() {
        if (ticker !== null) clearInterval(ticker);
        ticker = null;
      }

      /** Time to the next board, counted down live. */
      function tick() {
        const now = Date.now();
        // Midnight went by with the card still open: there is a board to play.
        if (utcDay(now) !== today) {
          startDaily();
          return;
        }
        const left = msUntilNextDay(now);
        const pad = (value) => String(value).padStart(2, '0');
        over.countdown.textContent = `${Math.floor(left / 3600000)}:`
          + `${pad(Math.floor(left / 60000) % 60)}:${pad(Math.floor(left / 1000) % 60)}`;
      }

      function openDailyEnd() {
        over.share.textContent = 'Ergebnis kopieren';
        over.shareLine.hidden = true;
        tick();
        if (ticker === null) ticker = setInterval(tick, 1000);
      }

      // ---- free play ---------------------------------------------------------

      function showFree(next) {
        mode = 'frei';
        writeMode(mode);
        stopTicker();
        boardKey = null;
        state = next;
        draw();
      }

      function newRun(seed = Math.floor(Math.random() * 1e9)) {
        record = false;
        parked = null;
        showFree(createRun({ seed, config: ENDLESS_RUN }));
      }

      /** Paints the switch to match the mode actually on screen. */
      function syncModes() {
        modeButtons.frei.setAttribute('aria-pressed', String(mode === 'frei'));
        modeButtons.taeglich.setAttribute('aria-pressed', String(mode === 'taeglich'));
      }

      /** Flips between the two modes. The free run is set aside rather than
       *  thrown away: a mistaken tap on the switch should cost nothing. */
      function setMode(next) {
        if (next === mode) return;
        if (next === 'taeglich') startDaily();
        else if (parked !== null) { const held = parked; parked = null; showFree(held); }
        else newRun();
      }

      goButton.addEventListener('click', () => { logDaily(null); apply(advance(state)); });
      over.restart.addEventListener('click', () => newRun());
      modeButtons.frei.addEventListener('click', () => setMode('frei'));
      modeButtons.taeglich.addEventListener('click', () => setMode('taeglich'));
      over.share.addEventListener('click', async () => {
        const line = shareLine();
        const copied = await copyText(line);
        over.share.textContent = copied ? 'Kopiert.' : 'Kopieren ging nicht';
        over.shareLine.textContent = line;
        over.shareLine.hidden = copied;
      });
      window.addEventListener('resize', () => scene && fitHitAreas(scene));

      // Every visit gets its own free run. A fixed opening seed would mean the
      // same first boards every time, and a record could be walked up by
      // reloading until a kind draw turned up. `?seed=` still pins a run down
      // for development and for comparing notes about one — and because that is
      // an explicit request for one particular board, it wins over the mode the
      // page was last left in.
      const asked = Number.parseInt(new URLSearchParams(location.search).get('seed') ?? '', 10);
      if (Number.isInteger(asked)) newRun(asked);
      else if (readMode() === 'taeglich') startDaily();
      else newRun();
    </script>
  </body>
</html>
